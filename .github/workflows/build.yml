name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o woo_manager_flutter.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash prepare.sh
        working-directory: woo_manager
      - run: flutter build apk --release
        working-directory: woo_manager
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: woo_manager/build/app/outputs/flutter-apk/app-release.apk
